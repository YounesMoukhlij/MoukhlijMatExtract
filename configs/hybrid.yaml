# Composite and framework electrolytes (polymer-ceramic, MOF, COF, plastic crystals, ionogels)
#
# Polymer-ceramic composite electrolytes (ceramic-in-polymer, polymer-in-ceramic), inorganic-organic hybrids,
# metal-organic framework (MOF) and covalent organic framework (COF) electrolytes, porous framework, organic
# ionic plastic crystal and ionogel electrolytes.
#
# Kind: material class (composites and framework electrolytes).
#   Prototype: polymer-ceramic composites, MOF and COF electrolytes, plastic crystals, ionogels.
#
# 142 queries, 24 topic words. Written by scripts/families/make_family_jobs.py; edit this copy freely
# (“Search settings…” in the Web scraping window), or the script to change every family at once.
#
# Run (each job keeps its own DOI list, PDF folder and database):
#   mme-web run --job configs/hybrid.yaml          # extracts into WebScraping/web_output_hybrid
#   mme-rank --domain electrolyte --source WebScraping/web_output_hybrid --kind arrhenius

name: hybrid

# Empty: the e-mail entered in the window ("API keys…", saved as MME_EMAIL in ~/MoukhlijMatExtract/.env) is used.
contact_email: ""

