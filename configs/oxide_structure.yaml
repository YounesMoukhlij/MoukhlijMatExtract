    - "phosphor"
    - "luminescence"
    - "photoluminescence"
    - "spin ice"
    - "frustrated magnet"
    - "magnetic frustration"
    - "ferrimagnetic"
    - "oxygen evolution"
    - "supercapacitor"
    - "photocatalyst"
    - "solar cell"
    - "fuel cell"
    - "SOFC"
    - "water splitting"
    - "electrolyzer"

  min_score: 2
  # Papers no free copy is known for are kept too: the repositories and the publishers' services are asked,
  # and what none of them has goes to to_download_by_hand.csv (with its link).
  propose_closed: true
  review: false

fetch:
  folder: WebScraping/papers_oxide_structure
  sources: [elsevier, wiley, springeroa, aps, openalex, unpaywall, publisher, arxiv, pmc, osti, hal, zenodo, datacite,
            semanticscholar, ads, openaire, core, crossref]
  workers: 4
  max_pdf_mb: 60

extract:
  properties: [Activation_Energy, Ionic_Conductivity, Diffusion_Coefficient, Electronic_Conductivity,
               Ionic_Radius]
  require_material: true
  # Materials of another kind (electrodes, interphase salts) are flagged; the ranking leaves them out.
  domain: electrolyte
