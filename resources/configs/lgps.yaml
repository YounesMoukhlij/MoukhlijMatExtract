# LGPS-type (Li10GeP2S12 family) solid electrolytes
#
# Li10GeP2S12 and its relatives: Li10SnP2S12, Li10SiP2S12, Li11Si2PS12, Li9.54Si1.74P1.44S11.7Cl0.3, and the
# LGPS-type selenides and oxygen- or halogen-substituted phases.
#
# Kind: crystal-structure type.
#   Prototype: Li10GeP2S12, tetragonal P42/nmc.
#
# 129 queries, 21 topic words. Written by scripts/families/make_family_jobs.py; edit this copy freely
# (“Search settings…” in the Web scraping window), or the script to change every family at once.
#
# Run (each job keeps its own DOI list, PDF folder and database):
#   mme-web run --job configs/lgps.yaml          # extracts into WebScraping/web_output_lgps
#   mme-rank --domain electrolyte --source WebScraping/web_output_lgps --kind arrhenius

