    # Nitride aliases
    - "lithium nitride"
    - "nitride solid electrolyte"
    - "nitride ionic conductor"
    - "lithium nitridophosphate"
    - "nitridophosphate"
    - "lithium nitridosilicate"
    - "nitridosilicate"
    - "lithium nitridoaluminate"
    - "lithium nitridoborate"
