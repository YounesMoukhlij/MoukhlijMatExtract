name: tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    name: tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Every supported Python on Linux; the newest on Windows and macOS.
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13"]
        include:
          - os: windows-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.13"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install Tesseract (for scanned pages) — Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr

      - name: Install Tesseract — macOS
        if: runner.os == 'macOS'
        run: brew install tesseract

      - name: Install Tesseract — Windows
        if: runner.os == 'Windows'
        run: |
          choco install tesseract --no-progress -y
          echo "C:\Program Files\Tesseract-OCR" >> $env:GITHUB_PATH

      - name: Install the package and test tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Download the spaCy language model
        run: python -m spacy download en_core_web_sm

      - name: Run the test suite
        run: python -m pytest

  package:
    # What a user installing from PyPI gets: the wheel, in a clean environment, run from another folder.
    name: the wheel, installed as from PyPI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build the wheel and the source archive
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Install the wheel into a clean environment
        run: |
          python -m venv "$RUNNER_TEMP/clean"
          "$RUNNER_TEMP/clean/bin/pip" install dist/*.whl

      - name: Every command answers, from outside the source folder
        working-directory: ${{ runner.temp }}
        env:
          HOME: ${{ runner.temp }}/home
        run: |
          mkdir -p "$HOME"
          for command in mme-gui mme-local mme-web mme-dois mme-rank mme-classify mme-eval mme-release; do
            "$RUNNER_TEMP/clean/bin/$command" --version
            "$RUNNER_TEMP/clean/bin/$command" --help > /dev/null
          done
          for sub in sheet score agree reference llm; do "$RUNNER_TEMP/clean/bin/mme-eval" $sub --help > /dev/null; done
          "$RUNNER_TEMP/clean/bin/mme-local" extract --help > /dev/null
          "$RUNNER_TEMP/clean/bin/mme-web" run --help > /dev/null
          test ! -e "$HOME/MoukhlijMatExtract"  # asking for help makes no folder

      - name: No secret is shipped
        run: |
          python - <<'EOF'
          import glob, zipfile
          names = zipfile.ZipFile(glob.glob("dist/*.whl")[0]).namelist()
          leaked = [n for n in names if n.endswith((".env", ".sqlite")) or "/tests/" in n]
          assert not leaked, leaked
          print(len(names), "files in the wheel, no .env, no test, no ledger")
          EOF
