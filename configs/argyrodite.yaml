  years: [2014, 2026]

  sources: [openalex, arxiv, crossref, semanticscholar, europepmc, openaire, doaj, jstage, core, springernature,
            scopus, ads, ieee, wos, zenodo, datacite, plos, ntrs, figshare, osf, lareferencia, thesesfr, lens, base,
            dimensions]

  max_per_query: 200
  include_preprints: true

  # Full-text searches on OpenAlex: every paper whose FULL TEXT holds all the quoted phrases of a line — the
  # papers that report the data even when their abstract does not say so (needs the free OPENALEX_API_KEY
  # for more than one page). The screening counts the phrases as the property words found.
  fulltext_queries:
    - "\"activation energy\" \"argyrodite\" \"ionic conductivity\""
    - "\"Arrhenius\" \"argyrodite\" \"ionic conductivity\""
  fulltext_max: 100000
  fulltext_open_only: false

  abstract_sources: [openaire, crossref, europepmc, semanticscholar, springernature, scopus, core, ads, ieee, plos]

  # DOI list collected for this job only.
  doi_list: WebScraping/Fetch_DOIs/dois_argyrodite.csv
  collect_dois: true
