  sources: [ elsevier, wiley, aps, openalex, unpaywall, publisher, arxiv, pmc, osti, hal, zenodo, datacite,
            semanticscholar, ads, openaire, core, crossref]
  workers: 3
  max_pdf_mb: 60

extract:
  properties: [Activation_Energy, Ionic_Conductivity, Diffusion_Coefficient, Electronic_Conductivity,
               Ionic_Radius]
  require_material: true
  # Values of materials that are no candidate electrolyte (electrodes, alloys, interphase salts, composites) are
  # flagged, and the ranking leaves them out. The other jobs: cathode.yaml, anode.yaml.
  domain: electrolyte
