# Perovskite-type lithium-ion conductors (LLTO and relatives)
#
# A-site-deficient perovskite lithium-ion conductors: Li3xLa2/3-xTiO3 (LLTO), LSTZ (Li3/8Sr7/16Ta3/4Zr1/4O3),
# Li-Sr-(Ta,Nb,Hf) perovskites. Halide perovskites for solar cells are kept out.
#
# Kind: crystal-structure type.
#   Prototype: ABO3 perovskite, A-site deficient; Li3xLa2/3-xTiO3 (P4/mmm, Cmmm).
#
# 130 queries, 23 topic words. Written by scripts/families/make_family_jobs.py; edit this copy freely
# (“Search settings…” in the Web scraping window), or the script to change every family at once.
#
# Run (each job keeps its own DOI list, PDF folder and database):
#   mme-web run --job configs/perovskite.yaml          # extracts into WebScraping/web_output_perovskite
#   mme-rank --domain electrolyte --source WebScraping/web_output_perovskite --kind arrhenius

