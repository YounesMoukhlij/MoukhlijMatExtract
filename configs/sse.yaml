# Solid-state electrolytes: ion transport in them (activation energy, ionic and electronic conductivity,
# diffusion coefficient).
#
#   mme-web run --job configs/sse.yaml
#   mme-rank --domain electrolyte --kind arrhenius
#
# The jobs for electrode materials are cathode.yaml and anode.yaml.


name: sse

# Empty: the e-mail entered in the window ("API keys…", saved as MME_EMAIL in ~/MoukhlijMatExtract/.env) is used.
