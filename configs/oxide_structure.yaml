    # Structure-type aliases
    - "spinel-type solid electrolyte"
    - "spinel solid electrolyte"
    - "spinel lithium ion conductor"
    - "spinel-type lithium conductor"
    - "pyrochlore solid electrolyte"
    - "pyrochlore-type solid electrolyte"
    - "pyrochlore lithium conductor"
    - "pyrochlore-type oxyfluoride"
    - "scheelite-type solid electrolyte"
    - "scheelite ion conductor"
    - "brownmillerite"
    - "brownmillerite-type"
    - "olivine-type ion conductor"
    - "layered oxide ion conductor"
    - "Ruddlesden-Popper lithium conductor"

