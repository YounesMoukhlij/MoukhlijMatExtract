# Multivalent-ion solid electrolytes (Mg2+, Ca2+, Zn2+, Al3+, Sc3+)
#
# Solid conductors of divalent and trivalent ions: magnesium (spinel chalcogenides such as MgSc2Se4,
# NASICON-type phosphates, borohydrides), calcium and zinc conductors, and the trivalent-cation conductors of
# the Sc2(WO4)3 type.
#
# Kind: grouping by mobile ion (Mg2+, Ca2+, Zn2+, Al3+, Sc3+).
#   Prototype: spinel MgSc2Se4, NASICON-type MgZr4(PO4)6, Sc2(WO4)3 type, Mg(BH4)2.
#
# 160 queries, 27 topic words. Written by scripts/families/make_family_jobs.py; edit this copy freely
# (“Search settings…” in the Web scraping window), or the script to change every family at once.
#
# Run (each job keeps its own DOI list, PDF folder and database):
#   mme-web run --job configs/multivalent.yaml          # extracts into WebScraping/web_output_multivalent
#   mme-rank --domain electrolyte --source WebScraping/web_output_multivalent --kind arrhenius

