# Oxide conductors by structure type: spinel, pyrochlore, scheelite, brownmillerite, olivine-related
#
# Lithium and sodium conductors of structure types without a file of their own: spinel, pyrochlore (including
# the pyrochlore-type oxyfluorides), scheelite, brownmillerite, olivine-related and layered oxide frameworks.
#
# Kind: crystal-structure types not covered elsewhere.
#   Prototype: spinel (Fd-3m), pyrochlore (Fd-3m), scheelite (I41/a), brownmillerite, olivine-related,
#   layered.
#
# 114 queries, 15 topic words. Written by scripts/families/make_family_jobs.py; edit this copy freely
# (“Search settings…” in the Web scraping window), or the script to change every family at once.
#
# Run (each job keeps its own DOI list, PDF folder and database):
#   mme-web run --job configs/oxide_structure.yaml          # extracts into WebScraping/web_output_oxide_structure
#   mme-rank --domain electrolyte --source WebScraping/web_output_oxide_structure --kind arrhenius

name: oxide_structure

# Empty: the e-mail entered in the window ("API keys…", saved as MME_EMAIL in ~/MoukhlijMatExtract/.env) is used.
contact_email: ""

search:
  queries:
    # Structure types: transport
    - "spinel lithium ion conductor solid electrolyte"
    - "spinel structure lithium diffusion pathway"
    - "pyrochlore lithium ion conductor"
    - "pyrochlore oxyfluoride lithium conductivity"
    - "scheelite structure ionic conductivity"
    - "brownmillerite ionic conductivity vacancy ordering"
    - "olivine structure lithium ion conduction electrolyte"
    - "layered oxide fast lithium ion conductor"
    - "new structure type lithium superionic conductor discovery"

    # spinel lithium ion conductor: every transport measurement and method
    - "spinel lithium ion conductor ionic conductivity"
    - "spinel lithium ion conductor activation energy"
    - "spinel lithium ion conductor lithium ion diffusion"
    - "spinel lithium ion conductor sodium ion diffusion"
    - "spinel lithium ion conductor lithium migration barrier"
