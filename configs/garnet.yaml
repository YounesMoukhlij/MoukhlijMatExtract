# Garnet-type solid electrolytes
#
# Lithium garnets: Li7La3Zr2O12 (LLZO) and its Al-, Ga-, Ta-, Nb-, W-doped forms, Li5La3M2O12 (M = Ta, Nb),
# Li6ALa2M2O12 (A = Ca, Sr, Ba) and the Te, Hf and Sn members.
#
# Kind: crystal-structure type.
#   Prototype: garnet A3B2(XO4)3; Li7La3Zr2O12: cubic Ia-3d, tetragonal I41/acd.
#
# 256 queries, 55 topic words. Written by scripts/families/make_family_jobs.py; edit this copy freely
# (“Search settings…” in the Web scraping window), or the script to change every family at once.
#
# Run (each job keeps its own DOI list, PDF folder and database):
#   mme-web run --job configs/garnet.yaml          # extracts into WebScraping/web_output_garnet
#   mme-rank --domain electrolyte --source WebScraping/web_output_garnet --kind arrhenius

