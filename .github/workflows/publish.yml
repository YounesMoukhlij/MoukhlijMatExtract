name: publish

# Uploads a release to TestPyPI, then to PyPI once the "pypi" environment is approved in GitHub. It runs only when a
# tag vX.Y.Z is pushed, and uploads only once PyPI and TestPyPI trust this workflow (docs/PUBLISHING.md § 6): no
# token is stored anywhere.
on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - name: The tag is the version of the package
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          test "${GITHUB_REF_NAME}" = "v${version}" || { echo "tag ${GITHUB_REF_NAME} is not v${version}"; exit 1; }
      - name: Build and check
        run: python -m pip install --upgrade build twine && python -m build && python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with: {name: dist, path: dist/}

  testpypi:
    needs: build
    runs-on: ubuntu-24.04
    environment: testpypi
    permissions: {id-token: write}
    steps:
      - uses: actions/download-artifact@v4
        with: {name: dist, path: dist/}
      - uses: pypa/gh-action-pypi-publish@release/v1
        with: {repository-url: "https://test.pypi.org/legacy/"}

  pypi:
    needs: testpypi
    runs-on: ubuntu-24.04
    environment: pypi          # set "required reviewers" on it: you approve each upload
    permissions: {id-token: write}
    steps:
      - uses: actions/download-artifact@v4
        with: {name: dist, path: dist/}
      - uses: pypa/gh-action-pypi-publish@release/v1
