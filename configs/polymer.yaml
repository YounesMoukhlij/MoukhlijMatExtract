# Polymer electrolytes (solvent-free, gel, single-ion, block copolymer)
#
# Solid and gel polymer electrolytes: polyethers (PEO), polycarbonates, polysiloxanes, PVDF-HFP, PAN and PMMA
# gels, polymer-in-salt and salt-in-polymer systems, single-ion conducting polymers, cross-linked and block
# copolymer electrolytes.
#
# Kind: material class (polymer electrolytes).
#   Prototype: polyethers (PEO), polycarbonates, polysiloxanes, PVDF-HFP and PAN gels, single-ion
#   polymers, block copolymers.
#
# 143 queries, 32 topic words. Written by scripts/families/make_family_jobs.py; edit this copy freely
# (“Search settings…” in the Web scraping window), or the script to change every family at once.
#
# Run (each job keeps its own DOI list, PDF folder and database):
#   mme-web run --job configs/polymer.yaml          # extracts into WebScraping/web_output_polymer
#   mme-rank --domain electrolyte --source WebScraping/web_output_polymer --kind arrhenius

name: polymer

# Empty: the e-mail entered in the window ("API keys…", saved as MME_EMAIL in ~/MoukhlijMatExtract/.env) is used.
contact_email: ""

