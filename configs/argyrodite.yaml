    - "Li6PS5Cl anion disorder ionic conductivity"
    - "halide rich argyrodite Li5.5PS4.5Cl1.5"
    - "Li6+xP1-xGexS5I lithium excess conductivity"
    - "argyrodite intercage intracage lithium jumps"
    - "argyrodite lithium sublattice polyhedral cages"
    - "Li6PS5Br Li6PS5I conductivity difference"

    # Argyrodite: synthesis and processing
