# NASICON-type solid electrolytes
#
# NASICON (Na superionic conductor) frameworks: Na1+xZr2SixP3-xO12 (NZSP) and its dopings, Na3Sc2(PO4)3, and the
# lithium members Li1+xAlxTi2-x(PO4)3 (LATP), Li1+xAlxGe2-x(PO4)3 (LAGP), LiZr2(PO4)3, LiHf2(PO4)3.
#
# Kind: crystal-structure type.
#   Prototype: NZP / NaZr2(PO4)3 framework, rhombohedral R-3c; Na3Zr2Si2PO12 also monoclinic C2/c.
#
# 294 queries, 55 topic words. Written by scripts/families/make_family_jobs.py; edit this copy freely
# (“Search settings…” in the Web scraping window), or the script to change every family at once.
#
# Run (each job keeps its own DOI list, PDF folder and database):
#   mme-web run --job configs/nasicon.yaml          # extracts into WebScraping/web_output_nasicon
#   mme-rank --domain electrolyte --source WebScraping/web_output_nasicon --kind arrhenius

