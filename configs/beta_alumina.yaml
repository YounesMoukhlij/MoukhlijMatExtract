# Beta-alumina solid electrolytes
#
# Sodium beta- and beta''-alumina (Na2O-Al2O3, Mg- or Li-stabilised beta''), and their potassium and
# lithium-exchanged forms, as used in sodium-sulfur, ZEBRA and AMTEC cells.
#
# Kind: crystal-structure type.
#   Prototype: beta-alumina P63/mmc, beta''-alumina R-3m.
#
# 119 queries, 23 topic words. Written by scripts/families/make_family_jobs.py; edit this copy freely
# (“Search settings…” in the Web scraping window), or the script to change every family at once.
#
# Run (each job keeps its own DOI list, PDF folder and database):
#   mme-web run --job configs/beta_alumina.yaml          # extracts into WebScraping/web_output_beta_alumina
#   mme-rank --domain electrolyte --source WebScraping/web_output_beta_alumina --kind arrhenius

name: beta_alumina

# Empty: the e-mail entered in the window ("API keys…", saved as MME_EMAIL in ~/MoukhlijMatExtract/.env) is used.
contact_email: ""

