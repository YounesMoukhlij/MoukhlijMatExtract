# Mixed-anion solid electrolytes (oxysulfides, sulfide-halides, nitride-halides)
#
# Solid electrolytes with two or more anions: oxysulfide glasses and crystals, sulfide-halides such as Li7P2S8I
# and Li4PS4I, and nitride-halides such as Li6NBr3 and Li5NCl2. The argyrodites, oxyhalides and
# anti-perovskites, mixed-anion too, have files of their own.
#
# Kind: chemical family (two or more anions).
#   Prototype: oxysulfides, sulfide-halides (Li7P2S8I), nitride-halides (Li6NBr3).
#
# 116 queries, 28 topic words. Written by scripts/families/make_family_jobs.py; edit this copy freely
# (“Search settings…” in the Web scraping window), or the script to change every family at once.
#
# Run (each job keeps its own DOI list, PDF folder and database):
#   mme-web run --job configs/mixed_anion.yaml          # extracts into WebScraping/web_output_mixed_anion
#   mme-rank --domain electrolyte --source WebScraping/web_output_mixed_anion --kind arrhenius

name: mixed_anion

# Empty: the e-mail entered in the window ("API keys…", saved as MME_EMAIL in ~/MoukhlijMatExtract/.env) is used.
contact_email: ""

