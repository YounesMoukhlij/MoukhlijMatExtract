[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "moukhlijmatextract"
version = "1.0.3"
description = "Extract, rank and classify solid-state-electrolyte data from scientific papers (activation energies, conductivities, diffusion coefficients)."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Younes Moukhlij", email = "younes.moukhlij@usms.ac.ma" }]
keywords = ["solid-state electrolytes", "materials science", "data extraction",
            "scientific literature", "activation energy", "ionic conductivity"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]

# The pipeline's runtime packages (same as requirements.txt). Tesseract (the system binary) is a
# separate install — see the README.
dependencies = [
    "PyMuPDF>=1.28",
    "pdfplumber>=0.11",
    "pytesseract>=0.3.13",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "spacy>=3.8",
    "preshed!=3.0.14",  # spaCy dependency; 3.0.14 was yanked from PyPI (crashes on model load)
    "pymatgen>=2024.1",
    "opencv-python-headless>=4.9",
    "Pillow",
    "numpy",
    "pint>=0.23",
    "requests>=2.31",
    "pyyaml>=6",
    "Send2Trash>=1.8",  # "Delete outputs…" moves files to the Trash, not deleted for good
]

[project.optional-dependencies]
dev = ["pytest"]

[project.urls]
Homepage = "https://github.com/YounesMoukhlij/MoukhlijMatExtract"
Repository = "https://github.com/YounesMoukhlij/MoukhlijMatExtract"

# One command per part (run from anywhere once installed):
[project.scripts]
mme-gui = "mme_gui.hub:main"
mme-local = "LocalExtraction.cli:main"
mme-web = "WebScraping.averageScrap.cli:main"
mme-rank = "SelectingTopMaterial.cli:main"
mme-classify = "Classification.cli:main"
mme-dois = "WebScraping.Fetch_DOIs.get_dois:main"
mme-eval = "Evaluation.cli:main"
mme-release = "Release.cli:main"

[tool.setuptools.packages.find]
include = ["LocalExtraction*", "WebScraping*", "SelectingTopMaterial*", "Classification*", "Evaluation*", "Release*", "mme_gui*"]
exclude = ["*.tests", "*.tests.*", "tests", "tests.*"]

[tool.setuptools.package-data]
SelectingTopMaterial = ["*.toml", "*.html"]
"WebScraping.averageScrap" = ["default_job.yaml"]   # the starter job for a fresh install
