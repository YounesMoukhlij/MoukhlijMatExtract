# Anti-perovskite solid electrolytes
#
# Lithium- and sodium-rich anti-perovskites: Li3OCl, Li3OBr, Li2OHCl, Na3OCl, Na3OBH4 and their mixed-anion and
# cluster-ion relatives.
#
# Kind: crystal-structure type.
#   Prototype: anti-perovskite (anti-ABX3); Li3OCl, cubic Pm-3m.
#
# 145 queries, 27 topic words. Written by scripts/families/make_family_jobs.py; edit this copy freely
# (“Search settings…” in the Web scraping window), or the script to change every family at once.
#
# Run (each job keeps its own DOI list, PDF folder and database):
#   mme-web run --job configs/antiperovskite.yaml          # extracts into WebScraping/web_output_antiperovskite
#   mme-rank --domain electrolyte --source WebScraping/web_output_antiperovskite --kind arrhenius

