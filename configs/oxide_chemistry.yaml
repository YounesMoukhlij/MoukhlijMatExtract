# Oxide conductors by chemistry: niobates, tantalates, zirconates, aluminates, borates, silicates, …
#
# Lithium and sodium oxides not covered by a structure-type file, grouped by chemistry: niobates (LiNbO3,
# Li3NbO4), tantalates (LiTaO3, Li7TaO6), zirconates (Li2ZrO3, Li6Zr2O7, Li8ZrO6), aluminates (LiAlO2, Li5AlO4),
# titanates, tungstates, molybdates, borates, silicates and germanates — as solid electrolytes, amorphous films
# and cathode coatings.
#
# Kind: chemical families (oxide anions).
#   Prototype: niobates, tantalates, zirconates, aluminates, titanates, tungstates, molybdates, borates,
#   silicates, germanates.
#
# 142 queries, 31 topic words. Written by scripts/families/make_family_jobs.py; edit this copy freely
# (“Search settings…” in the Web scraping window), or the script to change every family at once.
#
# Run (each job keeps its own DOI list, PDF folder and database):
#   mme-web run --job configs/oxide_chemistry.yaml          # extracts into WebScraping/web_output_oxide_chemistry
#   mme-rank --domain electrolyte --source WebScraping/web_output_oxide_chemistry --kind arrhenius

