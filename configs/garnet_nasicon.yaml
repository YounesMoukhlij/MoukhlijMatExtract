# Garnet and NASICON solid electrolytes only: ion transport and transport-related
# properties, including activation energy, ionic/electronic conductivity and diffusion.
#
# A paper is considered relevant when it concerns Garnet or NASICON electrolytes
# (or a recognized composition/material from these families) and contains relevant
# transport, electrochemical, structural, experimental or computational information.
#
# Run:
#   mme-web run --job configs/garnet_nasicon.yaml --output WebScraping/web_output_garnet_nasicon
#   mme-rank --domain electrolyte --source WebScraping/web_output_garnet_nasicon --kind arrhenius
#
# This job keeps its papers, search ledger and DOI list separate from other jobs.

name: garnet_nasicon

# Empty: the e-mail entered in the window ("API keys…", saved as MME_EMAIL in ~/MoukhlijMatExtract/.env) is used.
