# Halide and oxyhalide solid electrolytes
#
# Lithium and sodium chlorides, bromides and fluorides (Li3YCl6, Li3InCl6, Li2ZrCl6, Li3ScCl6, Na3YCl6,
# Na2ZrCl6, NaAlCl4) and the oxyhalides (LiTaOCl4, LiNbOCl4, NaNbOCl4).
#
# Kind: chemical family (anion: Cl, Br, I, F; oxyhalides).
#   Prototype: Li3MX6 (Li3YCl6 P-3m1, Li3InCl6 C2/m), Li2MCl6 (Li2ZrCl6 P-3m1).
#
# 151 queries, 59 topic words. Written by scripts/families/make_family_jobs.py; edit this copy freely
# (“Search settings…” in the Web scraping window), or the script to change every family at once.
#
# Run (each job keeps its own DOI list, PDF folder and database):
#   mme-web run --job configs/halide.yaml          # extracts into WebScraping/web_output_halide
#   mme-rank --domain electrolyte --source WebScraping/web_output_halide --kind arrhenius

