# LISICON and thio-LISICON solid electrolytes
#
# The LISICON family (gamma-Li3PO4 type: Li14Zn(GeO4)4, Li4SiO4-Li3PO4, Li3VO4-Li4GeO4 solid solutions) and its
# sulfide analogues, the thio-LISICONs (Li4-xGe1-xPxS4, Li4GeS4, Li4SnS4).
#
# Kind: crystal-structure type.
#   Prototype: gamma-Li3PO4 (Pnma): Li14Zn(GeO4)4; thio-LISICON Li4-xGe1-xPxS4.
#
# 127 queries, 36 topic words. Written by scripts/families/make_family_jobs.py; edit this copy freely
# (“Search settings…” in the Web scraping window), or the script to change every family at once.
#
# Run (each job keeps its own DOI list, PDF folder and database):
#   mme-web run --job configs/lisicon.yaml          # extracts into WebScraping/web_output_lisicon
#   mme-rank --domain electrolyte --source WebScraping/web_output_lisicon --kind arrhenius

