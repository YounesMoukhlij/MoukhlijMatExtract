[pytest]
# `python -m pytest` (and `make test`) runs the tests of the four parts only.
# WebScraping/moukhlij4scraping/tests/test_sources.py is not a pytest test: it downloads from the
# live sites, and is run by hand (python WebScraping/moukhlij4scraping/tests/test_sources.py).
testpaths = LocalExtraction WebScraping SelectingTopMaterial Classification mme_gui
addopts = --ignore=WebScraping/moukhlij4scraping
