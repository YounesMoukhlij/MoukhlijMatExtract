# Fluoride, oxyfluoride and fluoride-ion solid electrolytes
#
# Lithium and sodium fluorides and oxyfluorides used as solid electrolytes or coatings, and the fluoride-ion
# conductors of fluoride-ion batteries (tysonite LaF3, fluorite BaF2-based, PbSnF4 type).
#
# Kind: chemical family (anion: F-, with oxyfluorides).
#   Prototype: tysonite LaF3 (P-3c1), fluorite (Fm-3m); Li3AlF6.
#
# 135 queries, 32 topic words. Written by scripts/families/make_family_jobs.py; edit this copy freely
# (“Search settings…” in the Web scraping window), or the script to change every family at once.
#
# Run (each job keeps its own DOI list, PDF folder and database):
#   mme-web run --job configs/fluoride.yaml          # extracts into WebScraping/web_output_fluoride
#   mme-rank --domain electrolyte --source WebScraping/web_output_fluoride --kind arrhenius

name: fluoride

# Empty: the e-mail entered in the window ("API keys…", saved as MME_EMAIL in ~/MoukhlijMatExtract/.env) is used.
contact_email: ""

