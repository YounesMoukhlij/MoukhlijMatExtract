# Thiophosphate glasses, glass-ceramics and sodium thio-salts
#
# Li2S-P2S5 glasses and glass-ceramics (Li7P3S11, beta-Li3PS4, 75Li2S-25P2S5, with LiI or LiBH4), the Li2S-SiS2
# / GeS2 / B2S3 glasses, and the sodium thiophosphates and thioantimonates (Na3PS4, Na3SbS4, Na11Sn2PS12).
#
# Kind: composition system.
#   Prototype: Li2S-P2S5 and Na2S-P2S5 glasses and glass-ceramics; Li7P3S11 (P-1), beta-Li3PS4 (Pnma),
#   cubic Na3PS4 (I-43m).
#
# 153 queries, 45 topic words. Written by scripts/families/make_family_jobs.py; edit this copy freely
# (“Search settings…” in the Web scraping window), or the script to change every family at once.
#
# Run (each job keeps its own DOI list, PDF folder and database):
#   mme-web run --job configs/sulfide_glass.yaml          # extracts into WebScraping/web_output_sulfide_glass
#   mme-rank --domain electrolyte --source WebScraping/web_output_sulfide_glass --kind arrhenius

