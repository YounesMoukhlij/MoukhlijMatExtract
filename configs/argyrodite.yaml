# Argyrodite-type solid electrolytes
#
# Lithium argyrodites Li6PS5X (X = Cl, Br, I), the halide-rich Li6-xPS5-xX1+x, the Ge-, Si- and Sb-substituted
# members, and the sodium argyrodites.
#
# Kind: crystal-structure type.
#   Prototype: Ag8GeS6 argyrodite; Li6PS5X, cubic F-43m.
#
# 147 queries, 26 topic words. Written by scripts/families/make_family_jobs.py; edit this copy freely
# (“Search settings…” in the Web scraping window), or the script to change every family at once.
#
# Run (each job keeps its own DOI list, PDF folder and database):
#   mme-web run --job configs/argyrodite.yaml          # extracts into WebScraping/web_output_argyrodite
#   mme-rank --domain electrolyte --source WebScraping/web_output_argyrodite --kind arrhenius

