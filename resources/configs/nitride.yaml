# Nitride, amide and imide solid electrolytes
#
# Lithium nitride (Li3N) and the lithium nitridophosphates, nitridosilicates, nitridoaluminates and
# nitridoborates, with lithium amide and imide conductors.
#
# Kind: chemical family (anion: N3-, with amides and imides).
#   Prototype: Li3N (P6/mmm); nitridophosphates (Li7PN4), nitridosilicates (Li2SiN2).
#
# 100 queries, 25 topic words. Written by scripts/families/make_family_jobs.py; edit this copy freely
# (“Search settings…” in the Web scraping window), or the script to change every family at once.
#
# Run (each job keeps its own DOI list, PDF folder and database):
#   mme-web run --job configs/nitride.yaml          # extracts into WebScraping/web_output_nitride
#   mme-rank --domain electrolyte --source WebScraping/web_output_nitride --kind arrhenius

name: nitride

# Empty: the e-mail entered in the window ("API keys…", saved as MME_EMAIL in ~/MoukhlijMatExtract/.env) is used.
contact_email: ""

search:
  queries:
    # Nitrides: transport
    - "Li3N single crystal lithium conductivity anisotropy"
    - "Li3N hydrogen doping conductivity"
    - "Li3N vacancy lithium migration"
    - "Li3N decomposition voltage electrolyte"
    - "Li3N interlayer lithium metal anode"
    - "Li7PN4 lithium ion conductivity"
    - "LiPN2 lithium conductivity"
    - "lithium nitridosilicate ionic conductivity"
    - "Li2SiN2 lithium conduction"
    - "nitride solid electrolyte stability lithium metal"
    - "lithium imide Li2NH conductivity"
    - "lithium amide LiNH2 ion conduction"

    # lithium nitride: every transport measurement and method
    - "lithium nitride ionic conductivity"
    - "lithium nitride activation energy"
    - "lithium nitride lithium ion diffusion"
    - "lithium nitride lithium migration barrier"
    - "lithium nitride ion transport mechanism"
    - "lithium nitride grain boundary conductivity"
    - "lithium nitride bulk ionic conductivity"
    - "lithium nitride impedance spectroscopy"
    - "lithium nitride temperature dependent conductivity"
    - "lithium nitride diffusion coefficient"
    - "lithium nitride doping ionic conductivity"
    - "lithium nitride electronic conductivity"
    - "lithium nitride electrochemical stability window"
    - "lithium nitride interfacial resistance"
    - "lithium nitride molecular dynamics lithium diffusion"
    - "lithium nitride density functional theory migration"
    - "lithium nitride NMR lithium dynamics"
    - "lithium nitride synthesis ionic conductivity"
    - "lithium nitride fast ion conductor"
    - "lithium nitride superionic conductor"

    # Li3N: every transport measurement and method
    - "Li3N ionic conductivity"
    - "Li3N activation energy"
    - "Li3N lithium ion diffusion"
    - "Li3N lithium migration barrier"
    - "Li3N ion transport mechanism"
    - "Li3N grain boundary conductivity"
