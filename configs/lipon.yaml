# LiPON and oxide-glass thin-film electrolytes
#
# Lithium phosphorus oxynitride (LiPON) and its relatives (LiSiPON, LiBON, LiPOS), amorphous Li3PO4 and lithium
# borate, borophosphate and silicate glasses used as thin-film or glassy oxide electrolytes.
#
# Kind: material class (amorphous thin films and oxide glasses).
#   Prototype: amorphous Li-P-O-N; lithium borate and borophosphate glasses.
#
# 103 queries, 31 topic words. Written by scripts/families/make_family_jobs.py; edit this copy freely
# (“Search settings…” in the Web scraping window), or the script to change every family at once.
#
# Run (each job keeps its own DOI list, PDF folder and database):
#   mme-web run --job configs/lipon.yaml          # extracts into WebScraping/web_output_lipon
#   mme-rank --domain electrolyte --source WebScraping/web_output_lipon --kind arrhenius

name: lipon

# Empty: the e-mail entered in the window ("API keys…", saved as MME_EMAIL in ~/MoukhlijMatExtract/.env) is used.
contact_email: ""

