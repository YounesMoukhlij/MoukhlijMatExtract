    - "\"Arrhenius\" \"garnet\" \"ionic conductivity\""
    - "\"activation energy\" \"NASICON\" \"ionic conductivity\""
    - "\"Arrhenius\" \"NASICON\" \"ionic conductivity\""
  fulltext_max: 100000
