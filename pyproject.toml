[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "moukhlijmatextract"
version = "1.1.0"
description = "Extract, rank and classify battery-materials data — solid electrolytes, cathodes and anodes — from scientific papers (activation energies, conductivities, diffusion coefficients)."
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Younes Moukhlij", email = "younes.moukhlij@usms.ac.ma" }]
keywords = ["solid-state electrolytes", "cathode materials", "anode materials", "batteries", "materials science", "data extraction",
            "scientific literature", "activation energy", "ionic conductivity"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Text Processing :: Linguistic",
    "Environment :: Console",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]

# The pipeline's runtime packages (same as requirements.txt). Tesseract (the system binary) is a
# separate install — see the README.
dependencies = [
    "PyMuPDF>=1.28",
    "pdfplumber>=0.11",
    "pytesseract>=0.3.13",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "spacy>=3.8",
    "preshed!=3.0.14",  # spaCy dependency; 3.0.14 was yanked from PyPI (crashes on model load)
    "pymatgen>=2024.1",
    "opencv-python-headless>=4.9",
    "Pillow",
    "numpy",
    "pint>=0.23",
    "requests>=2.31",
    "pyyaml>=6",
    "Send2Trash>=1.8",  # "Delete outputs…" moves files to the Trash, not deleted for good
    "matplotlib>=3.8",  # the charts of the Statistics windows, saved as 300 dpi PNG and SVG
]

[project.optional-dependencies]
dev = ["pytest"]

[project.urls]
Website = "https://moukhlijmatextract.vercel.app"
Homepage = "https://github.com/YounesMoukhlij/MoukhlijMatExtract"
Repository = "https://github.com/YounesMoukhlij/MoukhlijMatExtract"
Documentation = "https://github.com/YounesMoukhlij/MoukhlijMatExtract/blob/main/docs/MANUAL.md"
Issues = "https://github.com/YounesMoukhlij/MoukhlijMatExtract/issues"
Changelog = "https://github.com/YounesMoukhlij/MoukhlijMatExtract/blob/main/CHANGELOG.md"

# One command per part (run from anywhere once installed):
[project.scripts]
mme = "mme_gui.commands:main"
mme-gui = "mme_gui.hub:main"
mme-local = "LocalExtraction.cli:main"
mme-web = "WebScraping.averageScrap.cli:main"
mme-rank = "SelectingTopMaterial.cli:main"
mme-classify = "Classification.cli:main"
mme-ml-export = "MLDataset.cli:main"
mme-dois = "WebScraping.Fetch_DOIs.get_dois:main"
mme-eval = "Evaluation.cli:main"
mme-release = "Release.cli:main"

[tool.setuptools.packages.find]
# The packages live in three folders of the repository: core/ (the pipeline), export/ and app/.
where = ["core", "export", "app"]
include = ["LocalExtraction*", "WebScraping*", "SelectingTopMaterial*", "Classification*", "Evaluation*", "Release*", "MLDataset*", "mme_gui*",
           "mme_home*"]
exclude = ["*.tests", "*.tests.*", "tests", "tests.*"]

[tool.setuptools.package-data]
SelectingTopMaterial = ["*.toml", "*.html"]
LocalExtraction = ["gui/assets/*.png"]  # the program's icon
