# Complex hydride and closo-borate solid electrolytes
#
# Borohydrides (LiBH4 and its halide-stabilised forms, Mg(BH4)2-based conductors), closo-borates and
# carba-closo-borates (Li2B12H12, Na2B12H12, LiCB11H12, NaCB11H12, LiCB9H10) and their mixtures.
#
# Kind: chemical family (complex anions BH4-, closo-borates).
#   Prototype: LiBH4 (high-T P63mc), Li2B12H12, LiCB11H12.
#
# 167 queries, 39 topic words. Written by scripts/families/make_family_jobs.py; edit this copy freely
# (“Search settings…” in the Web scraping window), or the script to change every family at once.
#
# Run (each job keeps its own DOI list, PDF folder and database):
#   mme-web run --job configs/complex_hydride.yaml          # extracts into WebScraping/web_output_complex_hydride
#   mme-rank --domain electrolyte --source WebScraping/web_output_complex_hydride --kind arrhenius

