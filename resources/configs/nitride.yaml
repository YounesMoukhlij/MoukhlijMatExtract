    - "Li3N impedance spectroscopy"
    - "Li3N temperature dependent conductivity"
    - "Li3N diffusion coefficient"
    - "Li3N doping ionic conductivity"
    - "Li3N electronic conductivity"
    - "Li3N electrochemical stability window"
    - "Li3N interfacial resistance"
    - "Li3N molecular dynamics lithium diffusion"
    - "Li3N density functional theory migration"
    - "Li3N NMR lithium dynamics"
    - "Li3N synthesis ionic conductivity"
    - "Li3N fast ion conductor"
    - "Li3N superionic conductor"

    # lithium nitridophosphate: every transport measurement and method
    - "lithium nitridophosphate ionic conductivity"
    - "lithium nitridophosphate activation energy"
    - "lithium nitridophosphate lithium ion diffusion"
    - "lithium nitridophosphate lithium migration barrier"
    - "lithium nitridophosphate ion transport mechanism"
    - "lithium nitridophosphate grain boundary conductivity"
    - "lithium nitridophosphate bulk ionic conductivity"
    - "lithium nitridophosphate impedance spectroscopy"
    - "lithium nitridophosphate temperature dependent conductivity"
    - "lithium nitridophosphate diffusion coefficient"
    - "lithium nitridophosphate doping ionic conductivity"
    - "lithium nitridophosphate electronic conductivity"
    - "lithium nitridophosphate electrochemical stability window"
    - "lithium nitridophosphate interfacial resistance"
    - "lithium nitridophosphate molecular dynamics lithium diffusion"
    - "lithium nitridophosphate density functional theory migration"
    - "lithium nitridophosphate NMR lithium dynamics"
    - "lithium nitridophosphate synthesis ionic conductivity"
    - "lithium nitridophosphate fast ion conductor"
    - "lithium nitridophosphate superionic conductor"

    # lithium nitridosilicate: every transport measurement and method
    - "lithium nitridosilicate activation energy"
    - "lithium nitridosilicate lithium ion diffusion"
    - "lithium nitridosilicate lithium migration barrier"
    - "lithium nitridosilicate ion transport mechanism"
